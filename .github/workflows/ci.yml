name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Database migrations and RLS tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-16 postgresql-16-pgvector >/dev/null
          PGBIN=/usr/lib/postgresql/16/bin scripts/test-db.sh
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
