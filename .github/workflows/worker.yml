# Calls the background worker every 10 minutes: schedules due job sources,
# runs ingestion, refreshes matches and applies data-retention deletes.
# Set repository secrets APP_URL (e.g. https://aptly.example.com) and CRON_SECRET.
name: Background worker
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run worker tick
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL/CRON_SECRET not set; skipping"; exit 0; fi
          for i in 1 2 3; do
            curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/tick?limit=3" && echo && sleep 5
          done
